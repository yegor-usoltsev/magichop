---
version: "2"

linters:
  default: none
  enable:
    # bugs and correctness
    - bodyclose
    - copyloopvar
    - errcheck
    - exhaustive
    - govet
    - ineffassign
    - staticcheck
    - unused

    # style and code quality
    - dupl
    - gochecknoinits
    - misspell
    - nakedret
    - nestif
    - nolintlint
    - testifylint
    - unconvert

    # error handling and security
    - errorlint

  settings:
    misspell:
      locale: US

  exclusions:
    paths:
      - builtin/
      - examples/
      - third_party/
      - vendor/
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)_test\.go
        linters:
          - dupl
          - gosec
          - noctx
          - wrapcheck

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - builtin/
      - examples/
      - third_party/
      - vendor/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  tests: true
  timeout: 100s

severity:
  default: error
